# abloh.yml - read from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails the check. Blocks merges only if also marked
# required in branch protection.
enforce: true

# The job in your own CI that Abloh's step rides. Abloh reads your workflows to
# pick it and proves the choice by running there; change it to move the step.
# That job runs once per matrix leg, and matrixLeg is the one it rides. Abloh's
# step carries an if: that is true on this leg only, so it measures once.
# In that job, test step `Run tests` runs on a condition Abloh cannot read from
# the file, so Abloh could not tell whether that step runs before its own. Its
# step went behind the last one that looks like your suite.
# In that job, test step `Run tests with coverage` runs on a condition Abloh
# cannot read from the file, so Abloh could not tell whether that step runs
# before its own. Its step went behind the last one that looks like your suite.
setup:
  job: .github/workflows/ci.yml::run
  matrixLeg:
    node: 22

# Rebuild recipe for the proof container. Comments name the source file.
environment:
  runtimeImage: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3 # reviewed Node 22 image (your CI's own Node, node >=22.19.0 in package.json, and a .nvmrc would outrank it)
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: npm run test:vi # ci.yml::run
  runner: vitest # abloh measures vitest. But your test script also runs npm run test:vi (vitest)
