name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

env:
  FORCE_COLOR: 2
  NODE_COV: lts/* # The Node.js version to run coveralls on

permissions:
  contents: read

jobs:
  run:
    permissions:
      id-token: write
      checks: write # for coverallsapp/github-action to create new checks
      contents: read # for actions/checkout to fetch code
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - lts/*

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:vi
        if: matrix.node != env.NODE_COV

      - name: Run tests with coverage
        run: npm run test:vi -- --coverage
        if: matrix.node == env.NODE_COV
      # Abloh. It sits right after "Run tests with coverage", the step that runs your
      # suite on this leg, so it measures the tree your suite ran in and rebuilds nothing
      # of yours. It puts that tree back exactly as it found it, so the steps below still
      # see what they always saw.
      # It installs its own CLI - and its own Node, if this runner's is older than 20.6 -
      # under RUNNER_TEMP, leaving your PATH alone.
      # model-token is Abloh's own credential for this repository, kept in your Actions
      # secrets. GitHub hands a secret to the step that names it and to no other step,
      # which is why Abloh asks for one instead of a job-wide id-token permission.
      # The if: runs it even when an earlier step of yours failed, so it says so rather
      # than vanishing. It reports on this pull request and gates nothing until merge,
      # and it files none of that itself - the abloh-publish job below does, because
      # this job holds no permission to. Pinned to a commit; a tag can be moved.
      # The rest of the if: pins it to the one leg named in abloh.yml's setup.matrixLeg,
      # so this job still fans out and Abloh measures once instead of once per leg.
      - name: Abloh
        if: ${{ !cancelled() && matrix.node == '22' }}
        uses: kkennethlau12393/abloh-action-census@8f4ea7e6947f53b76ca24974572f1ed2eb3c2465
        with:
          # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
          # rather than the published CLI. Recorded in every row this workflow produced.
          cli-tarball: .abloh-census/engine/abloh-cli-0.1.4.tgz .abloh-census/engine/abloh-core-0.1.3.tgz .abloh-census/engine/abloh-engine-aster-0.1.0.tgz .abloh-census/engine/abloh-engine-v2-0.1.0.tgz .abloh-census/engine/abloh-measure-0.1.0.tgz .abloh-census/engine/abloh-replay-0.1.0.tgz .abloh-census/engine/abloh-sandbox-0.1.2.tgz .abloh-census/engine/abloh-source-analysis-0.1.0.tgz .abloh-census/engine/abloh-triage-0.1.2.tgz
          base: ${{ github.event.pull_request.base.sha }}
          job-status: ${{ job.status }}
          publish: attestation-job
          model-token: ${{ secrets.ABLOH_MODEL_TOKEN }}
      # ---------------------------------------------------------------------------------
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
      # that are not what `abloh init` wrote. It keeps the run's own artifact so the
      # census can classify from evidence rather than from this job's log. It runs after
      # everything Abloh does and cannot reach what was measured.
      # ---------------------------------------------------------------------------------
      - name: census - keep the run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-evidence-manifest.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-run.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-engine-v2-proofs.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-refusal.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: matrix.node == env.NODE_COV
        continue-on-error: true
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
  # Abloh's publish job. It runs no code of yours, builds nothing and measures nothing:
  # it takes the report the Abloh step above left on this run and files it.
  #
  # It is a separate job because GitHub grants id-token: write to a whole JOB and
  # not to one step: putting it on the job above would hand the same identity to every
  # step that runs there, Abloh's and everybody else's. Here it reaches Abloh's step
  # and nothing else. It authorizes one thing, filing this report with Abloh, and
  # carries no write access to your repository. Declaring the block below takes no
  # grant away from anything, because this job is new and had none.
  abloh-publish:
    needs: run
    # Runs even when the job above failed - a trial that stopped is the report you need.
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Abloh publish
        uses: kkennethlau12393/abloh-action-census/attest@8f4ea7e6947f53b76ca24974572f1ed2eb3c2465
